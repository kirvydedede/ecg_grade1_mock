<title>心電図検定1級 模擬試験</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#111827;--muted:#64748b;--line:#dbe3ee;--nav:#0f172a;--accent:#2563eb;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}.app{max-width:920px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:var(--nav);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:16px}.topright{display:flex;align-items:center;gap:10px}.timer{font-variant-numeric:tabular-nums;font-weight:800}.badge{font-size:12px;background:#1e293b;border:1px solid #334155;border-radius:999px;padding:5px 8px}
main{padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(15,23,42,.05);margin-bottom:14px}.hero h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted);line-height:1.6}.modegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mode{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left}.mode strong{display:block;font-size:16px}.mode span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:800}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:700}.danger{background:#fff;color:var(--bad);border:1px solid #fecaca;border-radius:12px;padding:11px 14px;font-weight:700}
.hidden{display:none!important}.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.qnum{font-weight:800}.cat{font-size:12px;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:5px 8px}.stem{font-size:17px;line-height:1.65;margin:12px 0}.ecgbox{background:#fff;border:1px solid #d7dde7;border-radius:12px;overflow:auto;margin:10px 0 14px}.ecgsvg{min-width:760px;display:block;width:100%;height:auto}.ecg-note{font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line);background:#fafafa}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;display:flex;gap:10px;align-items:flex-start}.choice.selected{border-color:#2563eb;background:#eff6ff}.choice.correct{border-color:#16a34a;background:#f0fdf4}.choice.wrong{border-color:#dc2626;background:#fef2f2}.letter{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e2e8f0;font-weight:800;flex:none}.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px}.actions .right{display:flex;gap:8px}.flag.on{color:#b45309;border-color:#f59e0b;background:#fffbeb}.explain{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);line-height:1.65}.explain b{color:#0f172a}.pager{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}.pg{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 0;font-size:12px}.pg.answered{background:#e0f2fe}.pg.current{outline:2px solid #2563eb}.pg.flagged{box-shadow:inset 0 -3px #f59e0b}.resultbig{font-size:42px;font-weight:900}.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}.stat b{display:block;font-size:20px}.reviewitem{border-top:1px solid var(--line);padding:12px 0}.small{font-size:12px;color:var(--muted)}.footer{padding:18px 14px 30px;color:var(--muted);font-size:12px;line-height:1.5}.version{font-weight:700}
@media(max-width:600px){main{padding:10px}.card{border-radius:13px;padding:13px}.modegrid{grid-template-columns:1fr}.hero h1{font-size:21px}.stem{font-size:16px}.resultgrid{grid-template-columns:1fr 1fr}.pager{grid-template-columns:repeat(5,1fr)}.brand{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">心電図検定1級 模擬試験</div><div class="topright"><span class="badge">波形版</span><span id="timer" class="timer hidden">90:00</span></div></header>
<main>
<section id="home">
  <div class="card hero"><h1>波形判読トレーニング</h1><div class="sub">構造は従来版のまま、問題を波形中心にリニューアル。合成した学習用心電図を見て診断・病態・責任部位を選びます。</div></div>
  <div class="modegrid">
    <button class="mode" onclick="startExam('mock')"><strong>本番模試</strong><span>50問 / 90分 / 採点は最後</span></button>
    <button class="mode" onclick="startExam('quick')"><strong>10問練習</strong><span>ランダム10問 / 解説を確認しながら</span></button>
    <button class="mode" onclick="startExam('weak')"><strong>苦手復習</strong><span>過去に間違えた問題だけ</span></button>
    <button class="mode" onclick="showStats()"><strong>成績・履歴</strong><span>最高点 / 最近の結果 / 苦手数</span></button>
  </div>
  <div class="card"><b>収録</b><div class="sub">虚血・梗塞、上室性/心室性不整脈、房室/脚ブロック、WPW、Brugada、電解質異常、肥大・負荷、ペースメーカなど。全50問。</div></div>
</section>

<section id="exam" class="hidden">
  <div class="card">
    <div class="qhead"><div><span id="qnum" class="qnum"></span> <span id="cat" class="cat"></span></div><div class="small" id="progress"></div></div>
    <div id="stem" class="stem"></div>
    <div class="ecgbox"><div id="ecg"></div><div class="ecg-note">学習用に合成した模式波形です。実際の臨床心電図とは細部が異なる場合があります。</div></div>
    <div id="choices" class="choices"></div>
    <div id="explain" class="explain hidden"></div>
    <div class="actions"><button id="flagbtn" class="secondary flag" onclick="toggleFlag()">☆ フラグ</button><div class="right"><button class="secondary" onclick="prevQ()">戻る</button><button id="nextbtn" class="primary" onclick="nextQ()">次へ</button></div></div>
    <div id="pager" class="pager"></div>
  </div>
</section>

<section id="result" class="hidden"></section>
<section id="stats" class="hidden"></section>
</main>
<div class="footer">心電図検定1級想定・高度判読版。教育目的の模擬アプリです。診療判断には使用しないでください。<br><span class="version">Version 3.0.0-grade1-advanced</span></div>
</div>
<script>
const Q = [
{id:1,cat:'虚血・冠動脈',pattern:'stemi_inf',stem:'68歳男性。突然の胸痛と冷汗。II・III・aVFでST上昇、I・aVLで鏡像性ST低下を認め、IIIのST上昇がIIより目立つ。最も疑う責任冠動脈はどれか。',choices:['左前下行枝近位部','右冠動脈','左回旋枝近位部','左主幹部'],ans:1,exp:'下壁STEMIでIII誘導のST上昇がIIより大きく、aVLに明瞭な鏡像性ST低下がある場合はRCA閉塞を強く示唆します。LCx閉塞でも下壁梗塞は起こり得ますが、この組合せはRCA優位です。'},
{id:2,cat:'虚血・冠動脈',pattern:'rvmi',stem:'74歳男性。下壁STEMIの波形に加え、血圧78/50 mmHg、頸静脈怒張、肺野清。右側胸部誘導相当でもST上昇を認める。最も適切な病態推定はどれか。',choices:['左室前壁広範梗塞','右室梗塞合併','急性心膜炎','乳頭筋断裂'],ans:1,exp:'下壁梗塞＋低血圧＋頸静脈怒張＋肺うっ血に乏しい所見は右室梗塞を強く示唆します。右側胸部誘導のST上昇も支持所見です。責任血管は近位RCAであることが多いです。'},
{id:3,cat:'虚血・冠動脈',pattern:'posterior',stem:'胸痛患者。V1–V3で水平型ST低下と高いR波、陽性T波を認める。最も優先して追加すべき誘導はどれか。',choices:['V7–V9','V3R–V4R','Lewis誘導','食道誘導'],ans:0,exp:'V1–V3のST低下＋高いR波は後壁ST上昇の鏡像所見を疑います。V7–V9を追加し、後壁ST上昇を確認します。'},
{id:4,cat:'虚血・冠動脈',pattern:'stemi_ant',stem:'58歳男性。V1–V4を中心に著明なST上昇。I・aVLにも上昇を伴い、下壁誘導に鏡像性変化を認める。最も疑う病変部位はどれか。',choices:['左回旋枝遠位部','右冠動脈遠位部','左前下行枝近位部','左前下行枝遠位部'],ans:2,exp:'前壁中隔に加えて高位側壁までST上昇が広がり、下壁にreciprocal changeを伴う場合は近位LAD閉塞を疑います。広い虚血範囲を反映します。'},
{id:5,cat:'虚血・冠動脈',pattern:'wellens',stem:'胸痛は現在消失。V2–V4に深く対称性のT波陰転化を認め、病的Q波はなくR波進行は保たれている。最も重要な推定はどれか。',choices:['右冠動脈完全閉塞','近位LAD高度狭窄','左回旋枝遠位部狭窄','急性心膜炎'],ans:1,exp:'胸痛消失時のV2–V4の深い対称性T波陰転化はWellens patternを考え、近位LADの高度狭窄を示唆します。単なる陰性T波として扱わないことが重要です。'},
{id:6,cat:'虚血・冠動脈',pattern:'dewinter',stem:'持続する胸痛。V2–V5でJ点から上向きのST低下と高く対称的なT波、aVRで軽度ST上昇を認める。最も適切な解釈はどれか。',choices:['良性早期再分極','LAD急性閉塞を示唆するSTEMI equivalent','高K血症のみ','左室肥大strain'],ans:1,exp:'de Winter patternは前胸部誘導の上向きST低下と高い対称性T波が特徴で、急性LAD閉塞を強く疑うSTEMI equivalentです。'},
{id:7,cat:'虚血・冠動脈',pattern:'stemi_lat',stem:'I・aVL・V5–V6でST上昇を認める。III・aVFには鏡像性ST低下。最も関連しやすい責任血管はどれか。',choices:['左回旋枝または対角枝','右冠動脈近位部','左前下行枝中隔枝のみ','肺動脈'],ans:0,exp:'高位側壁〜側壁のST上昇はLCxまたはLADの対角枝領域を考えます。誘導分布から責任領域を推定することが1級では重要です。'},
{id:8,cat:'虚血・冠動脈',pattern:'qwave_ant',stem:'V1–V4に病的Q波とR波進行不良。急性ST上昇は目立たない。壁運動異常の既往がある。最も整合する診断はどれか。',choices:['陳旧性前壁心筋梗塞','急性下壁梗塞','右室肥大','正常亜型'],ans:0,exp:'前胸部誘導の病的Q波とR波進行不良は既往の前壁梗塞を示唆します。急性期のST上昇が消失後もQ波が残存します。'},
{id:9,cat:'虚血・冠動脈',pattern:'pericarditis',stem:'胸痛は前屈で軽減。多数誘導でびまん性ST上昇とPR低下、aVRでは逆方向の変化。最も考えられる診断はどれか。',choices:['急性心膜炎','前壁STEMI','高K血症','Brugada症候群'],ans:0,exp:'局在性ではなくびまん性のST上昇にPR低下を伴う点が急性心膜炎に典型的です。STEMIでは責任冠動脈領域に沿った局在性変化を考えます。'},
{id:10,cat:'虚血・冠動脈',pattern:'earlyrep',stem:'28歳男性、無症状。V2–V5にJ点notchingを伴う上向きST上昇。過去心電図でも同様。最も適切な判断はどれか。',choices:['急性前壁梗塞','早期再分極パターン','急性心膜炎','高K血症'],ans:1,exp:'若年無症候者で安定しており、J点notchingとconcaveなST上昇を伴う場合は早期再分極を考えます。臨床経過と局在性・鏡像変化の有無も鑑別に重要です。'},

{id:11,cat:'頻拍・機序',pattern:'vtmono',stem:'陳旧性心筋梗塞のある72歳男性。180/分の規則正しいwide QRS tachycardia。P波とQRSは独立し、capture beatを認める。最も可能性が高い診断はどれか。',choices:['心房粗動＋変行伝導','単形性心室頻拍','AVNRT＋脚ブロック','pre-excited AF'],ans:1,exp:'器質的心疾患、wide QRS、房室解離、capture/fusion beatはVTを強く支持します。wide QRS頻拍ではまずVTとして考えるのが安全です。'},
{id:12,cat:'頻拍・機序',pattern:'svtaberr',stem:'若年者の規則正しいwide QRS tachycardia。洞調律時にも同一形態の完全右脚ブロックがあり、頻拍中に明らかな房室解離はない。最も妥当な鑑別はどれか。',choices:['変行伝導を伴う上室頻拍','心室細動','Torsades de pointes','pre-excited AF'],ans:0,exp:'wide QRS頻拍はVTを最優先に考えますが、洞調律時の脚ブロックと頻拍中QRSがほぼ同形ならSVT with aberrancyの可能性が上がります。'},
{id:13,cat:'頻拍・機序',pattern:'avnrt',stem:'突然発症する規則正しい狭QRS頻拍。心拍数170/分。QRS直後にV1でpseudo-r′、下壁誘導でpseudo-Sを認める。最も考えられる機序はどれか。',choices:['心房内マクロリエントリー','房室結節内リエントリー','副伝導路を順行するAVRT','心室内リエントリー'],ans:1,exp:'典型的slow-fast AVNRTでは心房と心室がほぼ同時興奮し、逆行P波がQRS終末に重なってV1 pseudo-r′や下壁pseudo-Sとして見えることがあります。'},
{id:14,cat:'頻拍・機序',pattern:'avrt',stem:'洞調律では短PRとデルタ波。発作時は規則正しい狭QRS頻拍で、QRS後に逆行性P波を認める。最も考えられる頻拍はどれか。',choices:['正方向性房室回帰性頻拍（orthodromic AVRT）','逆方向性AVRT','心房細動','洞性頻脈'],ans:0,exp:'orthodromic AVRTでは房室結節を順行し、副伝導路を逆行するためQRSは通常狭くなります。洞調律時のpre-excitationが手掛かりです。'},
{id:15,cat:'頻拍・機序',pattern:'preexcitedaf',stem:'WPW既知の患者。極めて不規則なwide QRS tachycardiaで、QRS幅・形態が拍ごとに変化し、最短RRが非常に短い。最も考えるべき病態はどれか。',choices:['変行伝導を伴う通常AF','pre-excited AF','単形性VT','心房粗動2:1伝導'],ans:1,exp:'不規則・wide・QRS形態が変化する頻拍をWPW患者で認めた場合はpre-excited AFを強く疑います。副伝導路を高速伝導してVFへ移行し得る危険な所見です。'},
{id:16,cat:'頻拍・機序',pattern:'flutter21',stem:'規則正しい150/分の狭QRS頻拍。下壁誘導で鋸歯状波が疑われるが、2:1伝導のため一部はQRS/Tに重なる。最も考えられる診断はどれか。',choices:['典型的心房粗動2:1伝導','AVNRT','洞性頻脈','心房細動'],ans:0,exp:'心室拍数が約150/分で規則正しい頻拍では、心房レート約300/分の心房粗動2:1伝導を必ず考えます。flutter waveがQRS/Tに隠れることがあります。'},
{id:17,cat:'頻拍・機序',pattern:'af',stem:'RR間隔は完全に不規則で一定したP波を認めない。QRSは狭い。最も適切な診断はどれか。',choices:['多源性心房頻拍','心房細動','心房粗動4:1伝導','洞性不整脈'],ans:1,exp:'irregularly irregularなRRと一定したP波の欠如はAFの基本所見です。MATでは少なくとも3種類のP波形が確認できます。'},
{id:18,cat:'頻拍・機序',pattern:'mat',stem:'COPD増悪中。120/分の不規則な狭QRS頻拍。3種類以上のP波形と変動するPR間隔を認める。診断はどれか。',choices:['心房細動','多源性心房頻拍','心房粗動','AVNRT'],ans:1,exp:'MATは3種類以上のP波形、可変PR、100/分超の不規則頻拍が特徴で、重症肺疾患に伴うことがあります。'},
{id:19,cat:'頻拍・機序',pattern:'at',stem:'規則正しい140/分の狭QRS頻拍。各QRS前に洞性Pとは異なる形態のP波が一定のRPで出現する。最も考えられる診断はどれか。',choices:['心房頻拍','AVNRT','心房細動','心室頻拍'],ans:0,exp:'異所性P波が規則正しくQRSに先行する場合はfocal atrial tachycardiaを考えます。P波形から起源推定を行うこともあります。'},
{id:20,cat:'頻拍・機序',pattern:'torsades',stem:'失神患者。洞調律時QTc 560 ms。発作時はQRS軸が基線の周囲をねじれるように変化する多形性wide QRS tachycardia。診断はどれか。',choices:['単形性VT','Torsades de pointes','AF with aberrancy','心房粗動'],ans:1,exp:'QT延長を背景にQRS振幅・軸が周期的に変化する多形性VTはTdPです。薬剤、低K/低Mg、徐脈など誘因評価が重要です。'},
{id:21,cat:'頻拍・機序',pattern:'pvc',stem:'洞調律中、先行P波を伴わない早期の幅広QRSが出現し、T波はQRS主成分と反対方向。その後に完全代償性休止を認める。診断はどれか。',choices:['心房期外収縮','心室期外収縮','房室接合部期外収縮','Mobitz II型'],ans:1,exp:'先行P波なしのpremature wide QRS、discordant T、完全代償性休止はPVCの典型です。'},
{id:22,cat:'頻拍・機序',pattern:'pac',stem:'基本洞調律。予定より早い異形P波がT波に重なって出現し、その後は狭QRS。最も考えるものはどれか。',choices:['心房期外収縮','心室期外収縮','洞停止','心室捕捉不全'],ans:0,exp:'早期異所性P波に続いて通常は狭QRSが出現するのがPACです。P波が先行T波に埋もれることがあります。'},

{id:23,cat:'徐脈・伝導',pattern:'wenckebach',stem:'P波は規則正しい。PRが拍ごとに延長し、ついにQRSが脱落。その後PRが短く戻る。最も考えられるブロックはどれか。',choices:['Mobitz II型','Mobitz I型（Wenckebach）','完全房室ブロック','洞房ブロック'],ans:1,exp:'PR漸増→QRS脱落→PR短縮でリセットするのがMobitz Iです。多くは房室結節レベルの伝導障害です。'},
{id:24,cat:'徐脈・伝導',pattern:'mobitz2',stem:'PR間隔は一定だが、突然P波の後のQRSが脱落する。QRSはもともと幅広い。最も重要な推定はどれか。',choices:['房室結節内の良性ブロックが多い','His-Purkinje系障害を示唆する','洞結節機能不全のみ','心房粗動を示す'],ans:1,exp:'Mobitz IIはHis-Purkinje系の障害であることが多く、wide QRSを伴えばさらに遠位伝導系病変を示唆します。高度房室ブロックへ進行し得ます。'},
{id:25,cat:'徐脈・伝導',pattern:'chb',stem:'P波は約80/分、QRSは約35/分で互いに無関係。QRSは幅広く、一定のescape rhythm。最も適切な解釈はどれか。',choices:['完全房室ブロック＋心室補充調律','2:1房室ブロック','洞停止＋接合部補充調律','心房細動＋徐脈'],ans:0,exp:'PとQRSが独立するAV dissociationは完全房室ブロック。wideで遅い補充調律はHis束以下の心室性escapeを示唆します。'},
{id:26,cat:'徐脈・伝導',pattern:'avb1',stem:'PR 320 msで全P波がQRSへ伝導。QRS幅は正常。診断として最も適切なのはどれか。',choices:['1度房室ブロック','Mobitz I型','Mobitz II型','完全房室ブロック'],ans:0,exp:'PR延長が固定し全P波が伝導しているため1度房室ブロックです。臨床では薬剤や迷走神経緊張など背景評価も行います。'},
{id:27,cat:'徐脈・伝導',pattern:'rbbb',stem:'QRS 150 ms。V1でrsR′、I・V6で幅広い終末S。電気軸は−60°でI/aVL qR、II/III/aVF rSも認める。最も適切な総合診断はどれか。',choices:['完全右脚ブロック＋左脚前枝ブロック','完全左脚ブロック','右脚ブロック＋左脚後枝ブロック','WPW症候群'],ans:0,exp:'RBBB所見に著明な左軸偏位とLAFB所見を伴えば二枝ブロック（RBBB＋LAFB）です。伝導系疾患の進行評価が重要です。'},
{id:28,cat:'徐脈・伝導',pattern:'lbbb',stem:'QRS 160 ms。V1でQS〜深いS、I・aVL・V5–V6で幅広くノッチを伴うR波、側壁q波欠如。最も考えられる所見はどれか。',choices:['完全右脚ブロック','完全左脚ブロック','左脚前枝ブロック単独','右室肥大'],ans:1,exp:'典型的LBBBではV1の陰性優位QRSと側壁誘導の幅広いR、正常な側壁q波の消失を認めます。'},
{id:29,cat:'徐脈・伝導',pattern:'junctional',stem:'42/分の規則正しい狭QRS。洞性P波はQRS前に見えず、QRS後に逆行性P波を認める。最も考えられる調律はどれか。',choices:['房室接合部補充調律','洞性徐脈','完全房室ブロック','心房細動'],ans:0,exp:'狭QRSで40–60/分程度、P波欠如または逆行性P波を伴う場合は房室接合部由来のescape rhythmを考えます。'},

{id:30,cat:'早期興奮・遺伝性',pattern:'wpw',stem:'PR短縮、デルタ波、QRS幅延長。V1–V2では初期成分が陽性優位。最も考えられる病態はどれか。',choices:['心室早期興奮（WPW pattern）','完全LBBB','Brugada type 1','高K血症'],ans:0,exp:'短PR＋delta＋wide QRSはpre-excitationです。胸部誘導の極性は副伝導路局在推定に利用されますが、単一誘導だけで断定せず全誘導を統合します。'},
{id:31,cat:'早期興奮・遺伝性',pattern:'brugada1',stem:'38歳男性。発熱時に失神。V1–V2高位肋間誘導でcoved型ST上昇後に陰性T波。最も考える心電図パターンはどれか。',choices:['Brugada type 1 pattern','早期再分極','右脚ブロックのみ','前壁梗塞'],ans:0,exp:'右側胸部誘導のcoved ST上昇＋陰性TはBrugada type 1。発熱で顕在化することがあり、高位肋間記録が診断に有用な場合があります。'},
{id:32,cat:'早期興奮・遺伝性',pattern:'longqt',stem:'反復する失神。QTcが著明に延長。最も直接的に関連する致死性不整脈はどれか。',choices:['AVNRT','Torsades de pointes','心房粗動','接合部頻拍'],ans:1,exp:'著明なQT延長はearly afterdepolarizationを介してTdPを生じる基盤になります。先天性・薬剤性・電解質異常を鑑別します。'},
{id:33,cat:'早期興奮・遺伝性',pattern:'shortqt',stem:'QTcが著明に短く、家族に若年突然死歴。最も考えるべき病態はどれか。',choices:['Short QT syndrome/pattern','Long QT syndrome','WPW症候群','急性心膜炎'],ans:0,exp:'QT短縮に家族歴や心房・心室性不整脈が伴う場合はShort QT syndromeを考えます。QTだけでなく臨床背景との統合が重要です。'},
{id:34,cat:'早期興奮・遺伝性',pattern:'epsilon',stem:'若年者。V1–V3のQRS終末直後に小さなepsilon波。右室由来PVC/VTを反復。最も関連する疾患はどれか。',choices:['不整脈原性右室心筋症','肥大型心筋症','急性心膜炎','左室緻密化障害のみ'],ans:0,exp:'右前胸部誘導のepsilon waveと右室由来心室性不整脈はarrhythmogenic right ventricular cardiomyopathyを示唆します。'},
{id:35,cat:'早期興奮・遺伝性',pattern:'osborn',stem:'深部体温30℃。徐脈とQT延長に加え、J点に明瞭な陽性ノッチ。最も適切な名称はどれか。',choices:['デルタ波','Osborn（J）波','epsilon波','U波'],ans:1,exp:'低体温に伴うJ点の陽性偏位はOsborn/J waveです。低体温では徐脈、PR/QRS/QT延長、不整脈も生じ得ます。'},

{id:36,cat:'電解質・薬剤',pattern:'hyperk',stem:'慢性腎不全。尖鋭T波に加えPR延長、P波平低化、QRS拡大が進行。最も考えられる電解質異常はどれか。',choices:['低K血症','高K血症','高Ca血症','低Na血症'],ans:1,exp:'高K血症はpeaked TからPR延長/P波消失、QRS拡大、sine-waveへ進行し得ます。波形の重症度進行を読むことが重要です。'},
{id:37,cat:'電解質・薬剤',pattern:'hypok',stem:'利尿薬使用中。ST低下、T波平低化、明瞭なU波を認める。最も考えられる異常はどれか。',choices:['高K血症','低K血症','高Ca血症','高Mg血症'],ans:1,exp:'低K血症ではT波平低化、ST低下、U波増高、見かけのQU延長を認めます。心室性不整脈リスクにも注意します。'},
{id:38,cat:'電解質・薬剤',pattern:'digoxin',stem:'心不全治療中。広範に下向きにえぐれるscooped ST低下を認めるが症状はなく、リズムは洞調律。最も典型的な説明はどれか。',choices:['ジギタリス効果','急性後壁梗塞','高K血症','Brugada pattern'],ans:0,exp:'digitalis effectではscooped ST depression、QT短縮などを認めます。薬剤効果そのものとジギタリス中毒による不整脈は区別します。'},
{id:39,cat:'心腔負荷・疾患',pattern:'lvh',stem:'高血圧歴20年。V1深いS、V5–V6高いR、I/aVL/V5–V6に非対称性ST低下・陰性T波。最も適切な総合診断はどれか。',choices:['左室肥大＋strain pattern','右室肥大','急性前壁STEMI','完全LBBB'],ans:0,exp:'高電位差に側壁誘導のdownsloping ST低下・非対称性T陰転を伴う場合はLVH with strainを考えます。虚血との鑑別には臨床背景と波形形態が重要です。'},
{id:40,cat:'心腔負荷・疾患',pattern:'rvh',stem:'肺高血圧症。右軸偏位、V1高R、V5–V6深いS、右側胸部誘導でstrain。最も考える所見はどれか。',choices:['左室肥大','右室肥大/右室負荷','LAFB','陳旧性前壁梗塞'],ans:1,exp:'右軸偏位、V1のR優位、左側胸部誘導の深いS、右前胸部strainはRVH/右室圧負荷を支持します。'},
{id:41,cat:'心腔負荷・疾患',pattern:'pe',stem:'突然の呼吸困難と低酸素血症。洞性頻脈、右軸偏位傾向、V1–V3 T陰転、S1Q3T3。最も考える病態はどれか。',choices:['急性肺血栓塞栓症による右心負荷','急性前壁梗塞','高K血症','急性心膜炎'],ans:0,exp:'PEでは洞性頻脈が最も多く、右心負荷として右軸偏位、右前胸部T陰転、RBBB、S1Q3T3などを認め得ます。S1Q3T3単独は感度が高くありません。'},
{id:42,cat:'心腔負荷・疾患',pattern:'lae',stem:'II誘導で幅広い二峰性P波、V1でP波終末陰性成分が増大。最も考える所見はどれか。',choices:['右房負荷','左房負荷','右室肥大','高K血症'],ans:1,exp:'P mitraleおよびV1でのP terminal force増大は左房負荷を支持します。僧帽弁疾患や左室拡張障害などの背景を考えます。'},
{id:43,cat:'心腔負荷・疾患',pattern:'rae',stem:'II・III・aVFで幅狭く高いP波。V1の初期陽性成分も増大。最も考える所見はどれか。',choices:['左房負荷','右房負荷','LBBB','WPW'],ans:1,exp:'下壁誘導の高い尖鋭P（P pulmonale）は右房負荷を示唆します。肺高血圧、慢性肺疾患などでみられます。'},

{id:44,cat:'ペースメーカ',pattern:'pacingv',stem:'各心室QRS直前に刺激スパイクがあり、その後に幅広いQRSが確実に出現している。最も適切な評価はどれか。',choices:['心室ペーシングでcapture良好','心室capture failure','undersensing','oversensing'],ans:0,exp:'ペーシングスパイク直後に一貫して心室脱分極が起きていればcaptureは成立しています。ペーシングQRSは通常wideです。'},
{id:45,cat:'ペースメーカ',pattern:'failurecapture',stem:'徐脈患者。ペーシングスパイクは規則的に出ているが、一部のスパイク後にP波またはQRSが出現しない。最も考えられる異常はどれか。',choices:['oversensing','capture failure','undersensing','正常作動'],ans:1,exp:'刺激は出ているのに心筋脱分極が生じないのがfailure to captureです。閾値上昇、リード問題、電解質異常などが原因になり得ます。'},
{id:46,cat:'ペースメーカ',pattern:'undersense',stem:'自己QRSが存在するにもかかわらず、その直後に不適切なペーシングスパイクが出現する。最も考えられる異常はどれか。',choices:['undersensing','oversensing','capture failure','正常DDD作動'],ans:0,exp:'自己心拍を認識できず不適切な刺激を出すのがundersensingです。対してoversensingはノイズ等を自己心拍と誤認し、必要なペーシングが抑制されます。'},
{id:47,cat:'ペースメーカ',pattern:'pacingv',stem:'完全房室ブロック患者の心室ペーシング波形。左脚ブロック様のwide QRSがみられる。最も一般的な説明はどれか。',choices:['右室からの心室ペーシングで生じる典型的形態','必ず左室リード断線を示す','pre-excited AFを示す','急性前壁梗塞を確定する'],ans:0,exp:'右室心尖部などからのペーシングでは心室興奮が右から左へ広がるためLBBB様wide QRSになりやすいです。'},

{id:48,cat:'総合判読',pattern:'brugada1',stem:'発熱時の失神。V1–V2にtype 1 Brugada pattern。家族に突然死歴がある。心電図所見の解釈として最も重要なのはどれか。',choices:['単なる完全右脚ブロックとして扱う','臨床背景を含めBrugada症候群を疑う','前壁STEMIと同義である','電解質異常のみで説明できる'],ans:1,exp:'Brugada patternの診断は波形だけでなく失神・VF/VT・家族歴など臨床背景と統合します。発熱はtype 1波形や不整脈を誘発することがあります。'},
{id:49,cat:'総合判読',pattern:'preexcitedaf',stem:'WPW患者のpre-excited AF。心電図上、極めて短いRR間隔と幅広く変化するQRSを認める。この波形が危険である主な理由はどれか。',choices:['房室結節を介して必ず徐脈になるため','副伝導路を介した高速心室応答からVFへ移行し得るため','必ず完全房室ブロックへ移行するため','洞停止を起こすため'],ans:1,exp:'pre-excited AFでは房室結節のフィルターを介さず副伝導路から高頻度に心室へ伝導し、極端な頻拍からVFへ移行し得ます。'},
{id:50,cat:'総合判読',pattern:'vtmono',stem:'器質的心疾患を背景にwide QRS tachycardia。AV dissociation、capture beat、fusion beatの3所見を認める。最も適切な結論はどれか。',choices:['VTを強く支持する','SVT with aberrancyを強く支持する','心房細動を示す','心房粗動2:1伝導を示す'],ans:0,exp:'AV dissociation、capture beat、fusion beatはいずれもVTを強く支持する古典的所見です。1級では「wide QRS＝VTかSVTか」だけでなく、根拠となる所見を統合して判読することが重要です。'}
];

let state={mode:null,qs:[],idx:0,ans:{},flags:{},start:0,timer:null,submitted:false};
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startExam(mode){
  let pool=[...Q]; if(mode==='weak'){const weak=JSON.parse(localStorage.getItem('ecgWeak')||'[]'); pool=Q.filter(q=>weak.includes(q.id)); if(!pool.length){alert('まだ苦手問題がありません。まず練習または模試を実施してください。');return;}}
  state={mode,qs:mode==='mock'?shuffle(pool).slice(0,50):mode==='quick'?shuffle(pool).slice(0,10):shuffle(pool),idx:0,ans:{},flags:{},start:Date.now(),timer:null,submitted:false};
  $('home').classList.add('hidden');$('result').classList.add('hidden');$('stats').classList.add('hidden');$('exam').classList.remove('hidden');
  if(mode==='mock'){ $('timer').classList.remove('hidden'); tick(); state.timer=setInterval(tick,1000);} else $('timer').classList.add('hidden');
  renderQ();
}
function tick(){let left=5400-Math.floor((Date.now()-state.start)/1000);if(left<=0){left=0;finishExam();} $('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}
function renderQ(){const q=state.qs[state.idx];$('qnum').textContent=`問題 ${state.idx+1}`;$('cat').textContent=q.cat;$('progress').textContent=`${state.idx+1} / ${state.qs.length}`;$('stem').textContent=q.stem;$('ecg').innerHTML=renderECG(q.pattern);
 const C=$('choices');C.innerHTML='';q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice'+(state.ans[q.id]===i?' selected':'');b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span>${c}</span>`;b.onclick=()=>selectAns(i);C.appendChild(b)});
 const ex=$('explain'); if(state.mode!=='mock' && state.ans[q.id]!==undefined){showExplanation();} else {ex.classList.add('hidden');ex.innerHTML='';}
 $('flagbtn').classList.toggle('on',!!state.flags[q.id]);$('flagbtn').textContent=state.flags[q.id]?'★ フラグ済':'☆ フラグ';$('nextbtn').textContent=state.idx===state.qs.length-1?'採点する':'次へ';renderPager();window.scrollTo({top:0,behavior:'smooth'});
}
function selectAns(i){const q=state.qs[state.idx];state.ans[q.id]=i;renderQ();}
function showExplanation(){const q=state.qs[state.idx],sel=state.ans[q.id];const buttons=[...$('choices').children];buttons.forEach((b,i)=>{b.classList.remove('correct','wrong'); if(i===q.ans)b.classList.add('correct'); if(i===sel&&i!==q.ans)b.classList.add('wrong')});$('explain').classList.remove('hidden');$('explain').innerHTML=`<b>${sel===q.ans?'正解':'不正解'}</b><br>${q.exp}`}
function toggleFlag(){const q=state.qs[state.idx];state.flags[q.id]=!state.flags[q.id];renderQ()}
function prevQ(){if(state.idx>0){state.idx--;renderQ()}}
function nextQ(){if(state.idx===state.qs.length-1){if(state.mode==='mock'&&Object.keys(state.ans).length<state.qs.length&&!confirm(`未回答が${state.qs.length-Object.keys(state.ans).length}問あります。採点しますか？`))return;finishExam()}else{state.idx++;renderQ()}}
function renderPager(){const p=$('pager');p.innerHTML='';state.qs.forEach((q,i)=>{const b=document.createElement('button');b.className='pg'+(state.ans[q.id]!==undefined?' answered':'')+(i===state.idx?' current':'')+(state.flags[q.id]?' flagged':'');b.textContent=i+1;b.onclick=()=>{state.idx=i;renderQ()};p.appendChild(b)})}
function finishExam(){if(state.submitted)return;state.submitted=true;if(state.timer)clearInterval(state.timer);$('timer').classList.add('hidden');let correct=0;const wrong=[];state.qs.forEach(q=>{if(state.ans[q.id]===q.ans)correct++;else wrong.push(q.id)});let weak=new Set(JSON.parse(localStorage.getItem('ecgWeak')||'[]'));state.qs.forEach(q=>{if(state.ans[q.id]===q.ans)weak.delete(q.id);else weak.add(q.id)});localStorage.setItem('ecgWeak',JSON.stringify([...weak]));const score=Math.round(correct/state.qs.length*100);const hist=JSON.parse(localStorage.getItem('ecgHist')||'[]');hist.unshift({date:new Date().toLocaleString('ja-JP'),mode:state.mode,correct,total:state.qs.length,score});localStorage.setItem('ecgHist',JSON.stringify(hist.slice(0,20)));const best=Math.max(score,Number(localStorage.getItem('ecgBest')||0));localStorage.setItem('ecgBest',best);
 $('exam').classList.add('hidden');const r=$('result');r.classList.remove('hidden');r.innerHTML=`<div class="card"><div class="small">結果</div><div class="resultbig">${score}%</div><div class="resultgrid"><div class="stat"><b>${correct}</b>正解</div><div class="stat"><b>${state.qs.length-correct}</b>誤答</div><div class="stat"><b>${best}%</b>最高</div></div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="reviewWrong()">誤答を復習</button><button class="secondary" onclick="goHome()">ホームへ</button></div></div><div class="card"><b>今回の誤答</b>${wrong.length?wrong.map(id=>{const q=Q.find(x=>x.id===id);return `<div class="reviewitem"><b>Q${id} ${q.cat}</b><div>${q.stem}</div><div class="small">正解：${q.choices[q.ans]}</div></div>`}).join(''):'<div class="sub">全問正解です。</div>'}</div>`;window.scrollTo(0,0)}
function reviewWrong(){const weak=JSON.parse(localStorage.getItem('ecgWeak')||'[]'); if(!weak.length){alert('苦手問題はありません');return} startExam('weak')}
function goHome(){$('exam').classList.add('hidden');$('result').classList.add('hidden');$('stats').classList.add('hidden');$('home').classList.remove('hidden');}
function showStats(){const h=JSON.parse(localStorage.getItem('ecgHist')||'[]'),best=localStorage.getItem('ecgBest')||0,weak=JSON.parse(localStorage.getItem('ecgWeak')||'[]');$('home').classList.add('hidden');const s=$('stats');s.classList.remove('hidden');s.innerHTML=`<div class="card"><div class="resultgrid"><div class="stat"><b>${best}%</b>最高得点</div><div class="stat"><b>${h.length}</b>受験回数</div><div class="stat"><b>${weak.length}</b>苦手問題</div></div><div style="margin-top:14px"><button class="secondary" onclick="goHome()">ホームへ</button></div></div><div class="card"><b>最近の履歴</b>${h.length?h.map(x=>`<div class="reviewitem"><b>${x.score}% (${x.correct}/${x.total})</b><div class="small">${x.date} / ${x.mode}</div></div>`).join(''):'<div class="sub">まだ履歴がありません。</div>'}</div>`}

function renderECG(pattern){
 const leads=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6']; const W=900,H=520,rowH=42,left=38; let svg=`<svg class="ecgsvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
 svg+=`<defs><pattern id="smallGrid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M 8 0 L 0 0 0 8" fill="none" stroke="#f7c7cd" stroke-width="0.5"/></pattern><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="url(#smallGrid)"/><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e99aa5" stroke-width="0.8"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)"/>`;
 leads.forEach((lead,i)=>{const y=26+i*rowH;svg+=`<text x="6" y="${y+4}" font-size="12" font-family="sans-serif" fill="#334155">${lead}</text>`;svg+=`<path d="${wavePath(pattern,lead,left,y,W-left-10)}" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`});
 svg+=`<path d="M55 505 v-10 h10 v10 h10" fill="none" stroke="#111827" stroke-width="1.5"/><text x="82" y="507" font-size="10" fill="#475569">1 mV</text></svg>`;return svg;
}
function wavePath(pattern,lead,x0,base,w){const pts=[];const rate=rateFor(pattern),rr=Math.max(34,12000/rate);let x=x0;const n=Math.ceil(w/rr)+2;let seed=(pattern+lead).split('').reduce((a,c)=>a+c.charCodeAt(0),0);for(let b=0;b<n;b++){let jitter=0;if(['af','mat','preexcitedaf'].includes(pattern))jitter=((Math.sin(seed+b*2.17)+1)/2-.5)*rr*.45;let cx=x0+b*rr+jitter;if(cx>w+x0)break;appendBeat(pts,pattern,lead,cx,base,rr,b,seed)} if(['sinuspause'].includes(pattern)){return pathWithPause(pts,x0,base,w,rr)} return toPath(pts,x0,base,w)}
function rateFor(p){if(['af'].includes(p))return 105;if(['flutter21','avnrt','avrt','at'].includes(p))return 150;if(['vtmono','svtaberr'].includes(p))return 170;if(['torsades','preexcitedaf'].includes(p))return 210;if(['chb','junctional','sabrady'].includes(p))return 45;if(['mat'].includes(p))return 125;if(['pacingv','failurecapture','undersense'].includes(p))return 70;return 72}
function appendBeat(P,p,l,c,b,rr,k,seed){const amp=leadPolarity(l),st=stShift(p,l),t=tMorph(p,l),qrs=qrsMorph(p,l);let pw=3,pa=2*amp;if(['af'].includes(p)){for(let j=-18;j<-5;j+=5)P.push([c+j,b+Math.sin((j+seed)*.7)*1.8]);}else if(['flutter21'].includes(p)){for(let j=-rr*.9;j<0;j+=rr/2)P.push([c+j,b+((j%(rr/2))/(rr/2)<.5?-2:2)]);}else if(!['junctional','avnrt','vtmono','torsades','preexcitedaf','pvc'].includes(p)){if(p==='lae'){P.push([c-26,b],[c-22,b-2.5*amp],[c-18,b],[c-14,b-2.5*amp],[c-10,b]);}else if(p==='rae'){P.push([c-23,b],[c-19,b-5*amp],[c-15,b]);}else if(p==='mat'){let s=((k%3)-1);P.push([c-24,b],[c-20,b-(2+s)*amp],[c-16,b]);}else P.push([c-22,b],[c-18,b-pa],[c-14,b]);}
 let pre=0;if(p==='wpw'||p==='avrt'){P.push([c-9,b],[c-6,b-qrs*amp*.25]);pre=4}
 if(p==='pvc'&&k===2){drawWide(P,c,b,amp*1.2,1.35);return}
 if(p==='pac'&&k===2){P.push([c-31,b],[c-27,b-3*amp],[c-23,b]);}
 if(p==='wenckebach'&&k%4===3)return;if(p==='mobitz2'&&k%4===2)return;
 if(p==='chb'){let vc=c+((k%2)?rr*.25:0);drawQRS(P,vc,b,amp,qrs,p,l);drawT(P,vc,b,amp,t,st,p,l);return}
 if(p==='torsades'){let scale=.8+Math.sin(k*.9)*.65;drawWide(P,c,b,amp*scale,1.4);return}
 if(['vtmono','svtaberr','preexcitedaf'].includes(p)){let sc=p==='preexcitedaf'?(0.75+(k%3)*.2):1;drawWide(P,c,b,amp*sc,1.25);return}
 if(p==='pacingv'||p==='failurecapture'||p==='undersense'){P.push([c-5,b+7],[c-5,b-12],[c-4.3,b+7]);if(p==='failurecapture'&&k===2)return;if(p==='undersense'&&k===3)P.push([c+6,b+7],[c+6,b-11],[c+6.7,b+7]);drawWide(P,c,b,amp,1.0);return}
 drawQRS(P,c+pre,b,amp,qrs,p,l);drawT(P,c+pre,b,amp,t,st,p,l);
 if(p==='hypok')P.push([c+26,b],[c+31,b-1.8*amp],[c+35,b]); if(p==='epsilon'&&['V1','V2','V3'].includes(l))P.push([c+9,b],[c+12,b-2*amp],[c+14,b]);}
function drawQRS(P,c,b,a,q,p,l){if(p==='rbbb'&&l==='V1'){P.push([c-5,b],[c-3,b-5],[c,b+4],[c+3,b-8],[c+6,b]);return}if(p==='lbbb'&&['I','aVL','V5','V6'].includes(l)){P.push([c-6,b],[c-3,b-6*a],[c,b-8*a],[c+3,b-6*a],[c+7,b]);return}if(p==='brugada1'&&['V1','V2'].includes(l)){P.push([c-5,b],[c-2,b-7],[c+1,b+4],[c+4,b-5],[c+7,b]);return}if(p==='qwave_ant'&&['V1','V2','V3','V4'].includes(l)||p==='qwave_inf'&&['II','III','aVF'].includes(l)){P.push([c-5,b],[c-3,b+6],[c,b-2*a],[c+3,b+2],[c+6,b]);return}P.push([c-5,b],[c-3,b+2*a],[c-1,b-7*a*q],[c+1,b+4*a],[c+3,b-2*a],[c+6,b]);}
function drawWide(P,c,b,a,s){P.push([c-8,b],[c-5,b-7*a*s],[c,b+8*a*s],[c+6,b-5*a*s],[c+11,b],[c+18,b-3*a],[c+27,b]);}
function drawT(P,c,b,a,t,st,p,l){let y=b-st; if(p==='digoxin'){P.push([c+7,b],[c+12,b+3],[c+18,b+4],[c+25,b+1],[c+31,b]);return} if(p==='osborn'){P.push([c+7,b],[c+10,b-4*a],[c+13,b],[c+18,y],[c+24,y-3*a*t],[c+31,b]);return}P.push([c+7,b],[c+11,y],[c+18,y-4*a*t],[c+25,y],[c+31,b]);}
function leadPolarity(l){return ['aVR'].includes(l)?-1:['V1'].includes(l)?-.65:['III'].includes(l)?.75:1}
function qrsMorph(p,l){if(p==='lvh'&&['V5','V6'].includes(l))return 1.5;if(p==='lvh'&&l==='V1')return 1.45;if(p==='rvh'&&l==='V1')return -1.25;return 1}
function tMorph(p,l){if(p==='hyperk')return 2;if(p==='hypok')return .35;if(p==='wellens'&&['V2','V3','V4'].includes(l))return -1.6;if(p==='brugada1'&&['V1','V2'].includes(l))return -1;if(p==='pe'&&['III','V1','V2','V3'].includes(l))return -1;if(p==='lvh'&&['I','aVL','V5','V6'].includes(l))return -1;return 1}
function stShift(p,l){const up=(arr,v=4)=>arr.includes(l)?v:0,down=(arr,v=3)=>arr.includes(l)?-v:0; if(p==='stemi_inf')return up(['II','III','aVF'],5)+down(['I','aVL'],3);if(p==='stemi_ant')return up(['V1','V2','V3','V4'],5);if(p==='stemi_lat')return up(['I','aVL','V5','V6'],5);if(p==='posterior')return down(['V1','V2','V3'],4);if(p==='rvmi')return up(['II','III','aVF','V1'],4);if(p==='dewinter')return down(['V2','V3','V4','V5'],3)+up(['aVR'],2);if(p==='pericarditis')return ['aVR'].includes(l)?-2:3;if(p==='earlyrep')return up(['V2','V3','V4','V5'],3);if(p==='brugada1')return up(['V1','V2'],5);if(p==='digoxin')return -2;if(p==='lvh'&&['I','aVL','V5','V6'].includes(l))return -2;return 0}
function toPath(P,x,b,w){P.sort((a,b)=>a[0]-b[0]);let d=`M ${x} ${b}`;for(const [px,py] of P){if(px>=x&&px<=x+w)d+=` L ${px.toFixed(1)} ${py.toFixed(1)}`}d+=` L ${x+w} ${b}`;return d}
function pathWithPause(P,x,b,w,rr){const lo=x+w*.42,hi=x+w*.64;const F=P.filter(([px])=>px<lo||px>hi);return toPath(F,x,b,w)}
